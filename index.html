<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kampung Rame — Desa Live dari Usulan Warga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --hijau:#2f5d43; --hijau2:#3f7a57; --krem:#fbf3e4; --kayu:#6b4226; --emas:#f2b134; --merah:#c8553d;
  --teks:#2a2a2a; --abu:#6f6a61; --panel:#fffaf0; --garis:#e6dcc8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1d3a2a;font-family:Nunito,system-ui,sans-serif;color:var(--teks)}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5;flex-wrap:wrap}
.chip{pointer-events:auto;background:rgba(255,250,240,.95);border:2px solid var(--kayu);border-radius:14px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--kayu)}
.brand{font-family:Fredoka,sans-serif;font-size:18px;color:var(--hijau)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#aaa}
.chip .dot.on{background:#3cb371;box-shadow:0 0 0 3px rgba(60,179,113,.25)}
.spacer{flex:1}
.kr{color:#8a5a00}
.zoom{position:fixed;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:5}
.btn-sq{width:40px;height:40px;border-radius:12px;border:2px solid var(--kayu);background:var(--panel);font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--kayu);cursor:pointer}
.btn-sq:active{transform:translateY(2px);box-shadow:0 1px 0 var(--kayu)}
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:4px;background:rgba(255,250,240,.97);border:2px solid var(--kayu);border-radius:18px;padding:5px;z-index:6;box-shadow:0 4px 0 var(--kayu)}
nav.bottom button{border:0;background:transparent;font-family:Nunito;font-weight:800;font-size:12px;color:var(--abu);padding:6px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:58px}
nav.bottom button span{font-size:19px}
nav.bottom button.aktif{background:var(--hijau);color:#fff}
.chat{position:fixed;left:10px;bottom:84px;width:min(340px,calc(100vw - 20px));z-index:5;display:flex;flex-direction:column;gap:6px}
.chat-log{background:rgba(20,35,26,.72);color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;max-height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}

.chat-row{display:flex;gap:6px}
.chat-row input{flex:1;border:2px solid var(--kayu);border-radius:12px;padding:9px 12px;font:inherit;font-weight:700;background:var(--panel);min-width:0}
.btn{border:2px solid var(--kayu);background:var(--emas);color:#3b2a10;font-family:Fredoka;font-weight:600;font-size:15px;border-radius:12px;padding:8px 14px;box-shadow:0 3px 0 var(--kayu);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--kayu)}
.btn.hijau{background:var(--hijau2);color:#fff}
.btn.putih{background:#fff}
.btn.kecil{font-size:13px;padding:5px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:62px;background:rgba(20,35,26,.8);color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px;z-index:4;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:5;display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:9;display:none}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100vw);max-height:78vh;overflow-y:auto;background:var(--panel);border:3px solid var(--kayu);border-bottom:0;border-radius:22px 22px 0 0;z-index:10;padding:18px 18px 26px;display:none;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet h2{font-family:Fredoka;color:var(--hijau);font-size:22px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sheet .sub{color:var(--abu);font-size:14px;margin-bottom:14px}
.sheet .tutup{position:absolute;right:14px;top:12px}
.kartu{background:#fff;border:2px solid var(--garis);border-radius:14px;padding:12px;margin-bottom:10px}
.kartu.emas{border-color:var(--emas);background:#fff8e6}
.usulan{display:flex;gap:10px;align-items:center}

.vote{display:flex;flex-direction:column;align-items:center;min-width:56px}
.vote .n{font-family:Fredoka;font-size:20px;color:var(--hijau)}
.vote button{border:2px solid var(--hijau2);background:#fff;color:var(--hijau2);border-radius:10px;font-weight:800;font-size:12px;padding:3px 8px;cursor:pointer}
.vote button.pilih{background:var(--hijau2);color:#fff}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:#e3f1e7;color:var(--hijau)}
.badge.dibangun{background:#ffe7b3;color:#8a5a00}
.form-row{display:flex;gap:8px;margin-bottom:12px}
.form-row input,.form-row select,textarea{flex:1;border:2px solid var(--garis);border-radius:12px;padding:10px 12px;font:inherit;font-weight:700;background:#fff;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical;margin-bottom:8px}
label.lbl{display:block;font-weight:800;font-size:13px;color:var(--abu);margin:8px 0 4px}
.warna-pilih{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.warna-pilih button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--garis);cursor:pointer}

.ktp{background:linear-gradient(135deg,#d9ecf7,#f3f9fd);border:2px solid #7aa7c7;border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center;margin-bottom:12px}

.ktp .baris{font-size:13px}
.ktp .baris b{display:inline-block;width:72px;color:#3b6584}
.ktp .judul{font-family:Fredoka;color:#3b6584;font-size:14px;letter-spacing:.5px;margin-bottom:4px}
.rt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rt-row .nama{width:64px;font-weight:800}
.rt-row .bar{flex:1;height:22px;background:#eee4d0;border-radius:12px;overflow:hidden}
.rt-row .bar div{height:100%;border-radius:12px;transition:width .5s}

table.top{width:100%;border-collapse:collapse;font-size:14px}
table.top td{padding:6px 4px;border-bottom:1px dashed var(--garis)}
table.top td.r{text-align:right;font-family:Fredoka;color:#8a5a00}
.game-area{text-align:center;padding:10px 0}
.pancing-bar{position:relative;height:34px;background:#cfe6f5;border:2px solid #3d6f99;border-radius:18px;margin:16px 0;overflow:hidden}
.pancing-zona{position:absolute;top:0;bottom:0;background:rgba(60,179,113,.6)}
.pancing-jarum{position:absolute;top:-2px;bottom:-2px;width:6px;background:var(--merah);border-radius:3px}
.besar{font-size:54px;line-height:1.1}
.status{font-family:Fredoka;font-size:20px;color:var(--hijau);min-height:28px;margin:6px 0}
.opsi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opsi button{border:2px solid var(--garis);background:#fff;border-radius:12px;padding:12px 8px;font:inherit;font-weight:800;cursor:pointer}
.opsi button.benar{background:#d6f5df;border-color:#3cb371}
.opsi button.salah{background:#fde0db;border-color:var(--merah)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:var(--hijau);color:#fff;font-weight:800;padding:10px 16px;border-radius:14px;z-index:20;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kosong{color:var(--abu);text-align:center;padding:16px;font-weight:700}
.warung-item{display:flex;align-items:center;gap:10px}
.warung-item .e{font-size:30px}
.warung-item .isi{flex:1}
@media (max-width:600px){
  .brand{font-size:15px}
  .chip{font-size:12px;padding:5px 9px}
  .chat{bottom:80px}
  .chat-log{max-height:90px}
  nav.bottom button{min-width:52px;padding:5px 6px;font-size:11px}

</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="top">
  <div class="chip brand">🏡 Kampung Rame</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';
// ================= KONSTANTA DUNIA =================
const T = 32, W = 48, H = 36;
const RUMPUT=0, JALAN=1, AIR=2, SAWAH=3, POHON=4, DERMAGA=6, LAPANGAN=7;
const LAHIR = new Date('2026-11-14T00:00:00+07:00').getTime();
const REF_TUTUP = new Date('2026-11-13T20:00:00+07:00').getTime(); // voting ditutup tiap 20.00 WIB
const HARI_MS = 864e5, SLOT_MS = 6*3600e3, WIB = 7*3600e3;
const siklusKini = (t=Date.now()) => Math.floor((t-REF_TUTUP)/HARI_MS);       // siklus voting yang sedang dibuka
const waktuTutup = c => REF_TUTUP + (c+1)*HARI_MS;
const slotKini = (t=Date.now()) => Math.floor((t-LAHIR)/SLOT_MS);
function wib(t=Date.now()){ const d=new Date(t+WIB); return {h:d.getUTCHours()+d.getUTCMinutes()/60, jam:d.getUTCHours(), mnt:d.getUTCMinutes(), dow:d.getUTCDay(), hari:Math.floor((t+WIB)/HARI_MS)}; }
function hashN(n){ n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }
const EVENT = [
  {k:'panen', e:'🌾', teks:'Panen raya di sawah! {RT} kebagian hasil terbanyak.', bonus:20},
  {k:'maling', e:'🐔', teks:'Maling ayam tertangkap berkat ronda {RT}!', bonus:15},
  {k:'hujan', e:'🌧️', teks:'Hujan deras turun, kolam penuh ikan. Hadiah mancing x2!'},
  {k:'kerjabakti', e:'🧹', teks:'{RT} kerja bakti membersihkan jalan desa.', bonus:10},
  {k:'tamu', e:'🧳', teks:'Tamu dari kota memborong gorengan. Warung Bu Siti diskon!'},
  {k:'arwana', e:'✨', teks:'Warga melihat arwana di kolam! Peluang ikan langka naik.'},
  {k:'lampu', e:'💡', teks:'Lampu jalan baru dipasang, desa makin terang.'},
  {k:'lomba', e:'🏃', teks:'Lomba balap karung antar-RT! {RT} juara.', bonus:12},
];
function eventDi(slot){
  const h = hashN(slot*7919+13);
  const ev = EVENT[h % EVENT.length], rt = ['RT 01','RT 02','RT 03','RT 04'][(h>>>8)%4];
  return {...ev, slot, rt: ev.bonus? rt : null, teks: ev.teks.replace('{RT}', rt), mulai: LAHIR + slot*SLOT_MS};
}
const eventKini = () => eventDi(slotKini());
function bonusEventRT(){
  const tot = {'RT 01':0,'RT 02':0,'RT 03':0,'RT 04':0};
  for (let s=0; s<=slotKini(); s++){ const e=eventDi(s); if (e.bonus && e.rt) tot[e.rt]+=e.bonus; }
  return tot;
}
const pasarMalam = () => { const w=wib(); return (w.dow===5||w.dow===6) && w.h>=18 && w.h<23; };
const MISI = [
  {k:'ikan', teks:'Tangkap 3 ikan di kolam', target:3},
  {k:'kuis', teks:'Jawab 5 soal kuis dengan benar', target:5},
  {k:'jajan', teks:'Jajan 2 kali di warung', target:2},
  {k:'chat', teks:'Kirim 3 pesan ke warga', target:3},
  {k:'vote', teks:'Pilih 1 usulan di papan', target:1},
];
const misiHariIni = () => MISI[hashN(wib().hari) % MISI.length];
const WARNA = ['#e76f51','#2a9d8f','#e9c46a','#8e7dbe','#f28482','#4d908e','#577590','#bc6c25','#ff7aa2','#43aa8b'];
const RTS = ['RT 01','RT 02','RT 03','RT 04'];
const RT_WARNA = {'RT 01':'#e76f51','RT 02':'#2a9d8f','RT 03':'#e9c46a','RT 04':'#8e7dbe'};

const BANGUNAN = [
  {id:'balai', nama:'Balai Desa', e:'🏛️', x:26,y:11,w:6,h:4, body:'#efe1bd', roof:'#9b2226'},
  {id:'warung', nama:'Warung Bu Siti', e:'🍵', x:16,y:12,w:5,h:4, body:'#f4b183', roof:'#6d4c41'},
  {id:'ronda', nama:'Pos Ronda', e:'🔦', x:26,y:20,w:3,h:3, body:'#d4a373', roof:'#5c3d2e'},
  {id:'papan', nama:'Papan Usulan', e:'📋', x:20,y:20,w:2,h:1, papan:true},
];
const OBJEK = [
  {id:'kolam', nama:'Kolam Pancing', e:'🎣', x:10.5, y:22.5},
  {id:'lapangan', nama:'Lapangan Badminton', e:'🏸', x:36.5, y:25},
];
const SLOT = [[4,13],[9,13],[33,12],[38,12],[43,12],[33,5],[38,5],[43,5],[26,4],[16,4],[17,24],[17,30],[28,26],[42,22],[36,30],[42,30]];
const KADES = {x:28.8, y:16.1};

// ================= PETA STATIS =================
const peta = [];
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let y=0;y<H;y++){ peta.push(new Array(W).fill(RUMPUT)); }
const isi = (x,y,w,h,t)=>{ for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++) if(peta[j]&&peta[j][i]!==undefined) peta[j][i]=t; };
isi(0,17,W,2,JALAN); isi(23,0,2,H,JALAN);
isi(2,2,12,10,SAWAH);
isi(6,22,10,9,AIR);
isi(10,21,2,4,DERMAGA);
isi(32,22,9,6,LAPANGAN);
isi(29,15,1,2,JALAN); isi(18,16,1,1,JALAN); isi(21,19,1,1,JALAN);
const zonaTerlarang = [];
BANGUNAN.forEach(b=>zonaTerlarang.push([b.x-1,b.y-1,b.w+2,b.h+2]));
SLOT.forEach(s=>zonaTerlarang.push([s[0]-1,s[1]-1,6,5]));
zonaTerlarang.push([31,21,11,8],[5,20,12,12],[27,14,4,4],[30,19,17,2],[6,11,6,3]);
const diZona=(x,y)=>zonaTerlarang.some(z=>x>=z[0]&&x<z[0]+z[2]&&y>=z[1]&&y<z[1]+z[3]);
for (let y=0;y<H;y++)for(let x=0;x<W;x++){
  if (peta[y][x]!==RUMPUT) continue;
  const tepi = x<1||y<1||x>=W-1||y>=H-1;
  if (tepi || (!diZona(x,y) && rnd()<0.09)) peta[y][x]=POHON;
}

// ================= STATE =================
const S = {
  uid: null, nama:'', rt:'RT 01', warna:WARNA[0], kr:0,
  usulan:[], votes:{}, skor:[], info:{teks:''}, bangunan:[],
  owner:false, dbOn:false, roomOn:false, bisaTulis:true,
  state:{siklus:-1}, stateLoaded:false, votesLoaded:false, usulanLoaded:false,
};
const me = {x:24*T, y:19.5*T, dir:1, moving:false, msg:'', mt:0, target:null, emo:''};
const peers = new Map();  // peer -> {x,y,tx,ty,n,rt,c,msg,mt,isMe}
const lastMt = {};
let zoom = 1.15, cam = {x:me.x, y:me.y}, keys = {};

const ls = {
  get(k,d){ try{ const v = localStorage.getItem('kr_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('kr_'+k, JSON.stringify(v)); }catch(e){} }
};
const prof = ls.get('ktp', null);
if (prof){ S.nama=prof.nama; S.rt=prof.rt; S.warna=prof.warna; }
S.kr = ls.get('kr', 0);
S.uid = ls.get('uid', null) || ('lokal-'+Math.random().toString(36).slice(2,10));
ls.set('uid', S.uid);

// ================= UTIL =================
const $ = id => document.getElementById(id);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k==='class') e.className = attrs[k];
    else if (k==='style') e.style.cssText = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (k==='text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => { if (c==null) return; e.append(c.nodeType? c : document.createTextNode(String(c))); });
  return e;
};
const bersih = (s, max) => String(s||'').replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,'').trim().slice(0,max);
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }
function hariKe(t=Date.now()){ return Math.max(1, Math.floor((t-LAHIR)/86400000)+1); }
function namaku(){ return S.nama || 'Warga Baru'; }

// ================= DATA (SUPABASE) =================
const SB_URL = 'https://awndxypledtrgeswmgdj.supabase.co';
const SB_KEY = 'sb_publishable_CgejV4M45R7nukrFCIUmSA_9K6uwGhN';
let sb = null, kanal = null;
S.voteCount = {}; S.myVote = null; S.rtTotal = null; S.terdaftar = false; S.kades = new Map();
const isKades = id => S.kades.has(id);
const namaKades = () => [...S.kades.values()].filter(Boolean)[0] || '';
// ====== JABATAN DESA ======
const JABATAN = {
  sekdes:   {n:'Sekretaris Desa', e:'📜', pre:'Sekdes ',  gedung:['balai']},
  ketua_rt: {n:'Ketua RT',        e:'🎖️', pre:'Ketua ',   gedung:[]},
  dokter:   {n:'Dokter',          e:'🩺', pre:'dr. ',     gedung:['rumah sakit','puskesmas','klinik','rs ']},
  bidan:    {n:'Bidan',           e:'💉', pre:'Bidan ',   gedung:['rumah sakit','puskesmas','klinik','rs ']},
  guru:     {n:'Guru',            e:'📚', pre:'Guru ',    gedung:['sekolah','perpus','tk ','sd ','smp','sma']},
  polisi:   {n:'Polisi',          e:'👮', pre:'Pak Pol ', gedung:['polisi','polsek']},

  if (/Batas Kr harian/.test(m)) return 'Batas Kr harian tercapai, lanjut besok ya!';

const antrianKr = []; let krJalan = false;
function tambahKr(n){
  S.kr = Math.max(0, S.kr + n); ls.set('kr', S.kr); updateTop();
  while (n > 50){ antrianKr.push(50); n -= 50; }
  if (n) antrianKr.push(n);
  jalankanKr();
}
async function jalankanKr(){
  if (krJalan || !S.dbOn || !S.terdaftar) return;
  krJalan = true;
  try {
    while (antrianKr.length){
      const n = antrianKr[0];
      const {data, error} = await sb.rpc('ubah_kr', {jumlah:n});
      if (error && /Terlalu cepat/.test(error.message||'')){ await new Promise(r=>setTimeout(r, 1000)); continue; }
      antrianKr.shift();
      if (error){ gagal(error); S.kr = Math.max(0, S.kr - n); }
      else S.kr = data + antrianKr.reduce((a,b)=>a+b, 0);
      ls.set('kr', S.kr); updateTop();
      await new Promise(r=>setTimeout(r, 1000));
    }
  } finally { krJalan = false; }
}

function semuaBangunan(){
  const built = S.bangunan.filter(b=>SLOT[b.slot]).map(b=>{
    const s = SLOT[b.slot]; const h = hashWarna(b.nama);
    return {id:'b_'+b.id, nama:b.nama, e:b.e, x:s[0], y:s[1], w:4, h:3, body:h[0], roof:h[1], built:b};
  });
  return BANGUNAN.concat(built);
}
function hashWarna(s){
  let h=0; for (const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0;
  const pal=[['#f6d6ad','#b5563f'],['#cde6f5','#3d6f99'],['#e9d5f5','#7b4fa1'],['#fde2e4','#c4566b'],['#e2f0cb','#5b8e3e'],['#fff1c1','#b07d1a'],['#d8e2dc','#4a6b5a']];
  return pal[h%pal.length];
}
function terhalang(px,py){
  const tx=Math.floor(px/T), ty=Math.floor(py/T);
  if (tx<0||ty<0||tx>=W||ty>=H) return true;
  const t = peta[ty][tx];
  if (t===POHON||t===AIR) return true;
  for (const b of semuaBangunan()){
    if (px>b.x*T+2 && px<(b.x+b.w)*T-2 && py>b.y*T+4 && py<(b.y+b.h)*T) return true;
  }
  return false;
}

function posisiPatroli(t){
  const seg = []; let total=0;
  for (let i=0;i<PATROLI.length;i++){ const a=PATROLI[i], b=PATROLI[(i+1)%PATROLI.length]; const d=Math.hypot(b[0]-a[0],b[1]-a[1]); seg.push([a,b,d]); total+=d; }
  let s = ((t/1000) * 1.2) % total;
  for (const [a,b,d] of seg){ if (s<=d){ const f=s/d; return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]; } s-=d; }
  return PATROLI[0];
}
function jadwalNPC(n, t){
  const h = wib(t).h;
  if (n.patroli && (h>=21 || h<4)){ const p=posisiPatroli(t); return {x:p[0], y:p[1], kata:'Ronda malam! Tok tok tok 🔦', jalan:true}; }
  for (const [a,b,x,y,kata] of n.jadwal) if (h>=a && h<b){
    const o = hashN(Math.floor(t/15000)*31 + n.i*977);
    return {x: x + ((o%100)/100-.5)*2.2, y: y + (((o>>>8)%100)/100-.5)*1.2, kata};
  }
  return null; // sedang di rumah / tidur
}

function aktivitasDesa(){

}

function terdekat(){

  const cek=(id,x,y,r)=>{ const d=Math.hypot(me.x-x, me.y-y); if(d<r && d<bd){bd=d;best={id};} };

  for (const b of semuaBangunan()) cek(b.id, (b.x+b.w/2)*T, (b.y+b.h)*T, Math.max(70, b.w*T/2+30));
  for (const o of OBJEK) cek(o.id, o.x*T, o.y*T, 80);
  return best;
}

// Hemat kuota: posisi dikirim 3x/detik hanya saat bergerak; presence hanya saat berhenti/berubah.
let lastPos = 0, lastPresence = 0, tadiGerak = false, sigP = '', lastMtKirim = 0;
function trackPresence(){
  if (!kanal || !S.roomOn) return;
  const p = {n:namaku(), rt:S.rt, c:S.warna, x:Math.round(me.x), y:Math.round(me.y), d:me.dir, emo:me.emo||''};
  const sig = JSON.stringify(p); if (sig === sigP) return;
  sigP = sig; lastPresence = performance.now();
  kanal.track(p).catch(()=>{});
}
function kirimPresence(paksa){
  if (!kanal || !S.roomOn) return;
  const now = performance.now();
  if (me.moving && now - lastPos > 333){
    lastPos = now;
    kanal.send({type:'broadcast', event:'pos', payload:{id:S.uid, x:Math.round(me.x), y:Math.round(me.y), d:me.dir, m:1}});
  }
  if (!me.moving && tadiGerak){
    kanal.send({type:'broadcast', event:'pos', payload:{id:S.uid, x:Math.round(me.x), y:Math.round(me.y), d:me.dir, m:0}});
  }
  tadiGerak = me.moving;
  if (me.mt && me.mt !== lastMtKirim && me.msg){
    lastMtKirim = me.mt;
    kanal.send({type:'broadcast', event:'chat', payload:{id:S.uid, n:namaku(), msg:me.msg}});
  }
  if (paksa || (!me.moving && now - lastPresence > 3000)) trackPresence();
}
function pasangKanal(){
  kanal = sb.channel('desa-utama', {config:{presence:{key:S.uid}, broadcast:{self:false}}});
  kanal.on('broadcast', {event:'pos'}, ({payload:p})=>{
    if (!p || p.id === S.uid) return;
    const o = peers.get(p.id); if (!o) return;
    if (typeof p.x !== 'number' || typeof p.y !== 'number') return;
    o.tx = Math.max(0, Math.min(W*T, p.x)); o.ty = Math.max(0, Math.min(H*T, p.y));
    o.d = p.d === -1 ? -1 : 1; o.m = !!p.m;
  });
  let segarTerakhir = 0;
  kanal.on('broadcast', {event:'segarkan'}, ()=>{ const n=Date.now(); if (n-segarTerakhir<3000) return; segarTerakhir=n; muatData(); });
  kanal.on('broadcast', {event:'chat'}, ({payload:p})=>{
    if (!p || p.id === S.uid) return;
    const msg = bersih(p.msg, 80); if (!msg) return;
    const o = peers.get(p.id);
    if (o){ o.msg = msg; o.mtLocal = performance.now(); }
    tambahLog((isKades(p.id)?'👑 ':'')+namaTampil(p.id, o ? o.n : (bersih(p.n,20)||'Warga')), msg);
  });
  kanal.on('presence', {event:'sync'}, ()=>{
    const st = kanal.presenceState(), ada = new Set();
    for (const key in st){
      if (key === S.uid) continue;
      const meta = st[key] && st[key][0]; if (!meta || typeof meta.x !== 'number') continue;
      ada.add(key);
      let o = peers.get(key);
      if (!o){
        o = {x:meta.x, y:meta.y, tx:meta.x, ty:meta.y, m:false};
        peers.set(key, o);
        if (S.sinkronAwal) tambahLog('', '👋 '+(bersih(meta.n,20)||'Warga')+' masuk kampung', true);
        if (isKades(key)){ tambahLog('', '👑 Pak Kades '+(bersih(meta.n,20)||'')+' datang ke desa!', true); toast('👑 Pak Kades '+(bersih(meta.n,20)||'')+' sedang keliling desa!'); }
      }
      o.n = bersih(meta.n,20) || 'Warga'; o.rt = RTS.includes(meta.rt) ? meta.rt : '';
      o.c = /^#[0-9a-f]{6}$/i.test(meta.c) ? meta.c : '#888'; o.emo = bersih(meta.emo,4);
      if (!o.m){ o.tx = Math.max(0,Math.min(W*T,meta.x)); o.ty = Math.max(0,Math.min(H*T,meta.y)); o.d = meta.d===-1?-1:1; }
    }
    for (const k of [...peers.keys()]) if (!ada.has(k)){ tambahLog('', '🚶 '+peers.get(k).n+' pulang', true); peers.delete(k); }
    S.sinkronAwal = true; updateTop();
  });
  kanal.subscribe(status=>{
    if (status === 'SUBSCRIBED'){ S.roomOn = true; sigP = ''; trackPresence(); }
    else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){ S.roomOn = false; }
    updateTop();
  });
}

// ================= LOOP =================
let tPrev = performance.now();
function loop(t){
  const dt = Math.min(.05, (t-tPrev)/1000); tPrev = t;
  gerak(dt, t);
  gambar(t);
  requestAnimationFrame(loop);
}
function gerak(dt, t){
  let vx=0, vy=0;
  if (keys['a']||keys['arrowleft']) vx-=1;
  if (keys['d']||keys['arrowright']) vx+=1;
  if (keys['w']||keys['arrowup']) vy-=1;
  if (keys['s']||keys['arrowdown']) vy+=1;
  if (vx||vy) me.target=null;
  if (me.target){
    const dx=me.target.x-me.x, dy=me.target.y-me.y, d=Math.hypot(dx,dy);
    if (d<4) me.target=null; else { vx=dx/d; vy=dy/d; }
  }
  const lari = keys['shift'];
  const sp = (lari?6.2:3.4)*T*dt;
  const len = Math.hypot(vx,vy)||1;
  me.moving = !!(vx||vy);
  if (me.moving){
    if (vx) me.dir = vx<0?-1:1;
    const nx = me.x + vx/len*sp, ny = me.y + vy/len*sp;
    let gerakX=false, gerakY=false;
    if (bebas(nx, me.y)){ me.x = nx; gerakX=true; }
    if (bebas(me.x, ny)){ me.y = ny; gerakY=true; }
    if (me.target && !gerakX && !gerakY) me.target=null;
  }
  // kamera
  cam.x += (me.x-cam.x)*Math.min(1,dt*6); cam.y += (me.y-cam.y)*Math.min(1,dt*6);
  // peers lerp
  peers.forEach(o=>{ if(o.tx==null) return; o.x += (o.tx-o.x)*Math.min(1,dt*10); o.y += (o.ty-o.y)*Math.min(1,dt*10); });
  // NPC
  const now = Date.now();
  NPC.forEach(n=>{
    const j = jadwalNPC(n, now);
    if (!j){ n.ada=false; n.awal=true; return; }
    const tx=j.x*T, ty=j.y*T;
    if (n.awal || !n.ada){ n.x=tx; n.y=ty; n.awal=false; }   // langsung di tempat jadwalnya
    n.ada=true; n.tx=tx; n.ty=ty;
    if (t>n.next){
      n.next = t + 6000 + Math.random()*9000;
      if (Math.random()<.4){ n.msg = Math.random()<.5 ? j.kata : n.lines[Math.floor(Math.random()*n.lines.length)]; n.mt=t; }
    }
    const dx=n.tx-n.x, dy=n.ty-n.y, d=Math.hypot(dx,dy);
    if (d>6*T){ n.x=tx; n.y=ty; }
    n.m = d>2; if (n.m){ const s=(j.jalan?1.25:1.6)*T*dt*(d>3*T?3:1); n.x+=dx/d*Math.min(s,d); n.y+=dy/d*Math.min(s,d); n.d = dx<0?-1:1; }
  });
  hujan.forEach(r=>{ r.y += 600*dt; r.x -= 80*dt; if (r.y>VH){ r.y=-10; r.x=Math.random()*(VW+100); } });
  kirimPresence(false);
  // prompt
  const o = terdekat();
  const pr = $('prompt');
  if (o && !sheetTerbuka()){ pr.style.display='block'; $('promptBtn').textContent = 'E · '+namaObjek(o.id); $('promptBtn').onclick=()=>buka(o.id); }
  else pr.style.display='none';
}
function namaObjek(id){
  if (id==='kades') return 'Ngobrol dengan Pak Sekdes';
  const b = semuaBangunan().find(x=>x.id===id) || OBJEK.find(x=>x.id===id);
  return b ? b.e+' '+b.nama : 'Lihat';
}

function gambar(t){
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle='#2b5a3c'; cx.fillRect(0,0,VW,VH);
  cx.save();
  cx.translate(VW/2, VH/2); cx.scale(zoom, zoom); cx.translate(-Math.round(cam.x), -Math.round(cam.y));
  cx.drawImage(statis, 0, 0);
  // riak kolam
  cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=2;
  for (let i=0;i<3;i++){ const r=((t/40+i*30)%90); cx.globalAlpha=1-r/90; cx.beginPath(); cx.arc(12.5*T, 26*T, r, 0, 7); cx.stroke(); }
  cx.globalAlpha=1;
  // daftar entitas untuk urutan kedalaman
  const ent = [];
  semuaBangunan().forEach(b=>ent.push({y:(b.y+b.h)*T, f:()=>gambarBangunan(b)}));
  ent.push({y:KADES.y*T, f:()=>gambarOrang(KADES.x*T, KADES.y*T, '#264653', 'Pak Sekdes', 1, false, '', t, true)});
  NPC.forEach(n=>{ if (n.ada) ent.push({y:n.y, f:()=>gambarOrang(n.x,n.y,n.c,n.n,n.d||1,n.m, (t-n.mt<5000)?n.msg:'', t, false, '')}); });
  if (pasarMalam()) [33,36.5,40,43.5].forEach((sx,i)=>ent.push({y:20.4*T, f:()=>gambarLapak(sx*T, 19.6*T, i, t)}));
  if (!warungBuka()) ent.push({y:16.05*T, f:()=>label(18.5*T, 16*T, '🔒 TUTUP · buka 06.00', '#3b2a1a', '#fff3c4')});
  peers.forEach((o,key)=>{ const k=isKades(key); ent.push({y:o.y, f:()=>gambarOrang(o.x,o.y,k?'#9b2226':o.c,namaTampil(key, o.n),o.d,o.m,(o.mtLocal && t-o.mtLocal<6000)?o.msg:'', t, k, o.rt||(k?'Kades':''), false, o.emo)}); });
  ent.push({y:me.y, f:()=>gambarOrang(me.x,me.y,S.owner?'#9b2226':S.warna,namaTampil(S.uid, namaku())+' (kamu)',me.dir,me.moving,(Date.now()-me.mt<6000)?me.msg:'', t, S.owner, S.rt, !S.owner, me.emo)});
  ent.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  // label objek
  OBJEK.forEach(o=>label(o.x*T, o.y*T-30, o.e+' '+o.nama, '#fffaf0', '#2f5d43'));
  if (me.target){ cx.strokeStyle='rgba(255,255,255,.8)'; cx.lineWidth=2; cx.beginPath(); cx.ellipse(me.target.x, me.target.y, 10, 5, 0, 0, 7); cx.stroke(); }
  cx.restore();
  // siang-malam (jam WIB, sama untuk semua warga)
  const jam = wib().h;
  let a = 0;
  if (jam>=18.5 || jam<5) a = .55; else if (jam>=17) a = (jam-17)/1.5*.55; else if (jam<6.5) a = (6.5-jam)/1.5*.55;
  if (a>0){ cx.fillStyle = 'rgba(15,25,70,'+a.toFixed(3)+')'; cx.fillRect(0,0,VW,VH); }
  if (a>.2){ // lampu-lampu desa menyala
    cx.save(); cx.globalCompositeOperation='lighter';
    const lampu = [[18.5,15.8],[29,15.6],[27.5,22.8],[21,19.6],[23.5,17],[11,21]];
    if (pasarMalam()) lampu.push([33,19.4],[36.5,19.4],[40,19.4],[43.5,19.4]);
    lampu.forEach(([lx,ly])=>{
      const sx=(lx*T-cam.x)*zoom+VW/2, sy=(ly*T-cam.y)*zoom+VH/2, r=70*zoom;
      const g=cx.createRadialGradient(sx,sy,0,sx,sy,r); g.addColorStop(0,'rgba(255,200,110,'+(a*.55).toFixed(3)+')'); g.addColorStop(1,'rgba(255,200,110,0)');
      cx.fillStyle=g; cx.fillRect(sx-r,sy-r,r*2,r*2);
    });
    cx.restore();
  }
  if (eventKini().k==='hujan'){
    cx.fillStyle='rgba(40,60,90,.18)'; cx.fillRect(0,0,VW,VH);
    cx.strokeStyle='rgba(210,225,255,.55)'; cx.lineWidth=1.2; cx.beginPath();
    hujan.forEach(r=>{ cx.moveTo(r.x,r.y); cx.lineTo(r.x-4,r.y+12); }); cx.stroke();
  }
}
function gambarLapak(x,y,i,t){
  const warna=['#e63946','#f4a261','#2a9d8f','#8e7dbe'][i], isi=['🍢','🎈','🍭','🎯'][i];
  cx.fillStyle='rgba(0,0,0,.18)'; cx.fillRect(x-28,y+20,56,6);
  cx.fillStyle='#8b5a2b'; cx.fillRect(x-26,y-6,4,28); cx.fillRect(x+22,y-6,4,28);
  cx.fillStyle='#fff3c4'; cx.fillRect(x-26,y+6,52,16);
  for (let k=0;k<4;k++){ cx.fillStyle = k%2?'#fff':warna; cx.fillRect(x-30+k*15,y-14,15,10); }
  cx.font='18px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(isi, x, y+13);
  cx.fillStyle = Math.sin(t/300+i)>0 ? '#ffd166':'#ff8fab'; cx.beginPath(); cx.arc(x, y-20, 4, 0, 7); cx.fill();
  if (i===0) label(x+50, y-38, '🎡 Pasar Malam Akhir Pekan', '#2b1d3a', '#ffd166');
}
function label(x,y,teks,bg,fg){
  cx.font = '700 12px Nunito, sans-serif';
  const w = cx.measureText(teks).width + 14;
  cx.fillStyle = bg; rr(x-w/2, y-10, w, 20, 10); cx.fill();
  cx.strokeStyle = fg; cx.lineWidth=1.5; cx.stroke();
  cx.fillStyle = fg; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(teks, x, y+1);
}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function gambarBangunan(b){
  const x=b.x*T, y=b.y*T, w=b.w*T, h=b.h*T;
  if (b.papan){
    cx.fillStyle='#6b4226'; cx.fillRect(x+8,y+4,5,T); cx.fillRect(x+w-13,y+4,5,T);
    cx.fillStyle='#a47148'; rr(x,y-22,w,30,4); cx.fill(); cx.strokeStyle='#5c3d2e'; cx.lineWidth=2; cx.stroke();

  cx.fillStyle='rgba(255,255,255,.15)'; cx.fillRect(x+14,y,w-28,5);

function gambarOrang(x,y,warna,nama,dir,jalan,msg,t,kades,rt,saya,emo){
  const ay = jalan ? Math.abs(Math.sin(t/90))*3 : 0;
  cx.fillStyle='rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(x, y+2, 10, 4, 0, 0, 7); cx.fill();
  // kaki
  cx.fillStyle='#3a3a3a';
  const k = jalan? Math.sin(t/90)*3 : 0;
  cx.fillRect(x-5+k, y-6, 4, 7); cx.fillRect(x+1-k, y-6, 4, 7);
  // badan
  cx.fillStyle=warna; rr(x-8, y-22-ay, 16, 17, 5); cx.fill();
  if (kades){ cx.fillStyle='#e9c46a'; cx.fillRect(x-8, y-14-ay, 16, 3); }
  // kepala
  cx.fillStyle='#f1c27d'; cx.beginPath(); cx.arc(x, y-29-ay, 8, 0, 7); cx.fill();
  cx.fillStyle='#2a2a2a'; cx.fillRect(x+dir*3-1, y-30-ay, 2, 2);
  if (kades){ cx.fillStyle='#111'; cx.fillRect(x-8, y-40-ay, 16, 5); cx.fillRect(x-6, y-44-ay, 12, 5); }
  else { cx.fillStyle='#3b2a1a'; cx.beginPath(); cx.arc(x, y-31-ay, 8, Math.PI, 0); cx.fill(); }
  if (saya){ cx.fillStyle='#ffd166'; cx.beginPath(); cx.moveTo(x-5,y-52); cx.lineTo(x+5,y-52); cx.lineTo(x,y-46); cx.closePath(); cx.fill(); }
  // nama
  cx.font = '800 11px Nunito, sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  const lbl = rt ? nama+' · '+rt.replace('RT ','RT') : nama;
  const w = cx.measureText(lbl).width+10;
  cx.fillStyle = kades? 'rgba(155,34,38,.9)' : 'rgba(20,35,26,.7)'; rr(x-w/2, y+6, w, 15, 7); cx.fill();
  cx.fillStyle='#fff'; cx.fillText(lbl, x, y+14);
  if (emo){ cx.font='16px sans-serif'; cx.fillText(emo, x+14, y-36); }
  if (kades && !msg && !rt){ label(x, y-58, '💬 Pak Sekdes', '#fff', '#9b2226'); }
  if (kades && rt){ cx.fillStyle='#ffd166'; cx.font='16px sans-serif'; cx.fillText('👑', x, y-52-ay); }
  if (msg){
    cx.font = '700 12px Nunito, sans-serif';
    const pecah = bungkus(msg, 150);
    const bw = Math.max(...pecah.map(s=>cx.measureText(s).width))+16, bh = pecah.length*15+10;
    const bx = x-bw/2, by = y-52-bh;
    cx.fillStyle='#fff'; rr(bx,by,bw,bh,8); cx.fill(); cx.strokeStyle='#6b4226'; cx.lineWidth=1.5; cx.stroke();
    cx.beginPath(); cx.moveTo(x-5,by+bh); cx.lineTo(x+5,by+bh); cx.lineTo(x,by+bh+6); cx.closePath(); cx.fill();
    cx.fillStyle='#2a2a2a'; pecah.forEach((s,i)=>cx.fillText(s, x, by+12+i*15));
  }
}
function bungkus(s, maxW){
  const kata = s.split(' '), out=[]; let baris='';
  for (const k of kata){ const c = baris? baris+' '+k : k; if (cx.measureText(c).width>maxW && baris){ out.push(baris); baris=k; } else baris=c; }
  if (baris) out.push(baris); return out.slice(0,4);
}

  [['06.00–21.00','🍵 Warung Bu Siti buka'],['05.00–19.30','🎣 Mang Ujang mancing (istirahat siang di warung)'],['15.30–18.30','🏸 Badminton sore bareng Teh Rina'],['20.00','⏳ Voting ditutup, pemenang otomatis dibangun'],['20.00–21.00','✨ Jam arwana: ikan langka lebih sering muncul'],['21.00–04.00','🔦 Pak Ronda patroli keliling desa'],['Jumat & Sabtu 18.00–23.00','🎡 Pasar malam'],['Tiap 6 jam','📰 Event desa baru'],['00.00','🎯 Misi harian baru']]

  const r = S.bangunan.slice().sort((a,b)=>b.t-a.t);
  if (!r.length) box.append(el('div',{class:'kosong',text:'Belum ada bangunan dari usulan warga. Usulanmu bisa jadi yang pertama!'}));
  r.forEach(b=>box.append(el('div',{class:'kartu'}, el('b',{}, (b.e||'🏠')+' '+bersih(b.nama,40)), el('div',{class:'meta',style:'font-size:12px;color:var(--abu)'}, 'Hari ke-'+(b.hari||1)+' · usulan '+(bersih(b.oleh,20)||'warga')+(RTS.includes(b.rt)?' ('+b.rt+')':'')))));

// ---------- MANCING ----------
const IKAN = [{n:'Ikan Mujair',e:'🐟',kr:3,w:38},{n:'Ikan Mas',e:'🐠',kr:5,w:26},{n:'Lele',e:'🐟',kr:4,w:16},{n:'Sandal jepit',e:'👡',kr:0,w:10},{n:'Udang galah',e:'🦐',kr:8,w:7},{n:'Arwana langka!',e:'✨',kr:25,w:3}];
function bobotIkan(i){ const ev=eventKini(), h=wib().h; let w=i.w; if (i.kr>=25 && (ev.k==='arwana' || (h>=20 && h<21))) w*=5; return w; }
function acakIkan(){ let r=Math.random()*IKAN.reduce((s,i)=>s+bobotIkan(i),0); for(const i of IKAN){ r-=bobotIkan(i); if(r<=0) return i; } return IKAN[0]; }
function isiMancing(box){
  game.aktif = true;
  box.append(el('h2',{text:'🎣 Kolam Pancing'}), el('div',{class:'sub',text:'Lempar kail, tunggu ikan nyangkut, lalu tarik saat jarum merah ada di zona hijau. Arwana lebih sering muncul jam 20.00–21.00 WIB.'}));
  const ev = eventKini(); if (ev.k==='hujan'||ev.k==='arwana') box.append(el('div',{class:'kartu emas'}, ev.e+' ', ev.teks));
  const ptK = elPetugas('kolam'); if (ptK) box.append(ptK);
  const besar = el('div',{class:'besar',text:'🎣'}), status = el('div',{class:'status',text:'Siap mancing?'});
  const zona = el('div',{class:'pancing-zona'}), jarum = el('div',{class:'pancing-jarum'});
  const bar = el('div',{class:'pancing-bar', style:'visibility:hidden'}, zona, jarum);
  const tombol = el('button',{class:'btn', style:'min-width:180px;font-size:18px'}, 'Lempar Kail');
  box.append(el('div',{class:'game-area'}, besar, status, bar, tombol, el('div',{class:'sub',style:'margin-top:10px',text:'Tips: tekan Spasi atau tombol.'})));
  let fase='siap', pos=0, arah=1, zx=0, zw=0, raf=0, to=0, lastT=0, cepat=1;
  const anim = (t)=>{ const dt=Math.min(.05,(t-lastT)/1000); lastT=t; pos += arah*dt*cepat; if(pos>1){pos=1;arah=-1;} if(pos<0){pos=0;arah=1;} jarum.style.left='calc('+(pos*100)+'% - 3px)'; raf=requestAnimationFrame(anim); };
  const aksi = ()=>{
    if (fase==='siap'||fase==='selesai'){
      fase='tunggu'; besar.textContent='🌊'; status.textContent='Menunggu ikan…'; tombol.disabled=true; bar.style.visibility='hidden';
      to = setTimeout(()=>{
        fase='tarik'; besar.textContent='❗'; status.textContent='Nyangkut! Tarik sekarang!'; tombol.disabled=false; tombol.textContent='TARIK!';
        zw = .14 + Math.random()*.12; zx = Math.random()*(1-zw); zona.style.left=(zx*100)+'%'; zona.style.width=(zw*100)+'%';
        cepat = .9 + Math.random()*.9; pos=0; arah=1; bar.style.visibility='visible'; lastT=performance.now(); raf=requestAnimationFrame(anim);
        to = setTimeout(()=>{ if(fase==='tarik'){ selesai(false,'Kelamaan, ikannya kabur 💨'); } }, 3500);
      }, 1200 + Math.random()*2800);
    } else if (fase==='tarik'){
      cancelAnimationFrame(raf); clearTimeout(to);
      const kena = pos>=zx && pos<=zx+zw;
      selesai(kena);
    }
  };
  const selesai = (kena, pesan)=>{
    cancelAnimationFrame(raf); fase='selesai'; tombol.textContent='Lempar Lagi'; tombol.disabled=false;
    if (kena){ const i=acakIkan(); const kali = eventKini().k==='hujan'?2:1; const dapat=i.kr*kali; besar.textContent=i.e; status.textContent = dapat? 'Dapat '+i.n+'! +'+dapat+' Kr'+(kali>1?' (bonus hujan)':'') : 'Yah, dapat '+i.n+' 😅'; if(dapat){ tambahKr(dapat); majuMisi('ikan'); } if (i.kr>=8){ me.msg='Dapat '+i.n+' '+i.e; me.mt=Date.now(); kirimPresence(true); } }
    else { besar.textContent='💨'; status.textContent = pesan || 'Meleset! Ikannya lepas.'; }
  };
  tombol.onclick = aksi; game.onSpace = aksi;
  game.stop = ()=>{ cancelAnimationFrame(raf); clearTimeout(to); };
}

  ['Alat musik bambu yang digoyangkan, khas Sunda, adalah…',['Angklung','Gamelan','Sasando','Kolintang'],0],

];
function isiKuis(box){
  game.aktif = true;
  const jeda = ls.get('kuisT',0), sisa = Math.ceil((jeda + 60000 - Date.now())/1000);
  box.append(el('h2',{text:'🔦 Kuis Pos Ronda'}), el('div',{class:'sub',text:'Jawab 3 soal. Tiap jawaban benar +3 Kr.'}));
  const ptR = elPetugas('pos ronda'); if (ptR) box.append(ptR);
  if (sisa>0){ box.append(el('div',{class:'kartu'}, 'Pak Ronda lagi ngopi. Kuis berikutnya dalam '+sisa+' detik ☕')); return; }
  const soal = SOAL.slice().sort(()=>Math.random()-.5).slice(0,3);
  let i=0, benar=0;
  const area = el('div',{}); box.append(area);
  const tampil = ()=>{
    area.innerHTML='';
    if (i>=soal.length){
      ls.set('kuisT', Date.now()); if (benar) tambahKr(benar*3);
      area.append(el('div',{class:'game-area'}, el('div',{class:'besar',text: benar===3?'🏆':benar?'👍':'😅'}), el('div',{class:'status',text:'Benar '+benar+'/3 · +'+(benar*3)+' Kr'}), el('button',{class:'btn',onclick:tutupSheet},'Selesai')));
      if (benar===3){ me.msg='Kuis ronda sempurna! 🏆'; me.mt=Date.now(); kirimPresence(true); }
      return;
    }
    const [q, ops, k] = soal[i];
    const urut = ops.map((o,j)=>({o, benar:j===k})).sort(()=>Math.random()-.5);
    const grid = el('div',{class:'opsi'});
    urut.forEach(u=>{ const b = el('button',{text:u.o}); b.onclick=()=>{
      grid.querySelectorAll('button').forEach(x=>{ x.disabled=true; if (urut[[...grid.children].indexOf(x)].benar) x.classList.add('benar'); });
      if (u.benar){ benar++; majuMisi('kuis'); } else b.classList.add('salah');
      setTimeout(()=>{ i++; tampil(); }, 900);
    }; grid.append(b); });
    area.append(el('div',{class:'kartu'}, el('div',{class:'meta',style:'font-size:12px;color:var(--abu)',text:'Soal '+(i+1)+' dari 3'}), el('b',{text:q})), grid);
  };
  tampil();
}

// ================= KONEKSI KE SUPABASE =================
async function sambung(){
  if (!window.supabase || !window.supabase.createClient){ toast('Tidak bisa memuat server desa, main mode solo dulu.'); updateTop(); return; }
  try {
    sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    let {data:{session}} = await sb.auth.getSession();
    if (!session){
      const r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      session = r.data.session;
    }
    S.uid = session.user.id; S.dbOn = true;
    const w = await sb.from('warga').select('nama,rt,warna,kr').eq('id', S.uid).maybeSingle();
    if (w.data){
      S.nama = w.data.nama; S.rt = w.data.rt; S.warna = w.data.warna; S.kr = w.data.kr; S.terdaftar = true;
      ls.set('ktp', {nama:S.nama, rt:S.rt, warna:S.warna}); ls.set('kr', S.kr);
      if (sheetTerbuka() && tabAktif==='ktp') tutupSheet();
    } else if (S.nama){
      S.kr = 0; await simpanWarga();
    } else S.kr = 0;
    updateTop();
    const adm = await sb.rpc('saya_admin'); S.owner = !!adm.data;
    await muatKades();
    if (S.owner) setTimeout(()=>toast('👑 Selamat datang, Pak Kades '+namaku()+'!'), 1200);
    await detak(true);
    await muatData();
    jalankanKr();
    setInterval(muatData, 15000);
    pasangKanal();
  } catch(e){
    console.warn('sambung', e);
    S.dbOn = false;
    toast(/anonymous/i.test((e && e.message)||'') ? 'Login tamu belum diaktifkan di Supabase (lihat panduan).' : 'Tidak bisa tersambung ke desa, main mode solo dulu.');
  }
  updateTop();
}
